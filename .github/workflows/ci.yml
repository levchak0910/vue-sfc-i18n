name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then                                                                                                
            pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}                                          
          elif [ "${{ github.event.forced }}" = "true" ]; then                                                                                                       
            pnpm commitlint --last                                                                                                                                   
          else                                                                                                                                                       
            pnpm commitlint --from ${{ github.event.before }} --to ${{ github.sha }}                                                                                 
          fi

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm fmt:check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm -F @vue-sfc-i18n/shared type-check
      - run: pnpm -F @vue-sfc-i18n/shared build
      - run: pnpm -F @vue-sfc-i18n/generate type-check
      - run: pnpm -F @vue-sfc-i18n/generate build
      - run: pnpm -r type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm -F @vue-sfc-i18n/shared test
      - run: pnpm -F @vue-sfc-i18n/composable test
      - run: pnpm -F @vue-sfc-i18n/shared build
      - run: pnpm -F @vue-sfc-i18n/generate test
      - run: pnpm -F @vue-sfc-i18n/eslint-plugin test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm -F @vue-sfc-i18n/shared build
      - run: pnpm -F @vue-sfc-i18n/generate build
      - run: pnpm -F @vue-sfc-i18n/composable build
      - run: pnpm -F @vue-sfc-i18n/vite-plugin install:deps
      - run: pnpm -F @vue-sfc-i18n/vite-plugin test:e2e
