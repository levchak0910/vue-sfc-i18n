name: Install
description: Install Node, enable corepack, install dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    - run: corepack enable
      shell: bash

    - run: pnpm install --frozen-lockfile
      shell: bash
